<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100% Sunshine Girl Forecast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="weather-card">
            <h1>100% Sunshine Girl Forecast</h1>
            
            <div class="search-box">
                <input type="text" id="cityInput" placeholder="Enter city name (e.g., Tokyo)...">
                <button onclick="getWeather()">Pray</button>
            </div>

            <div id="weatherDisplay" class="hidden">
                <h2 id="location">--</h2>

                <img id="weatherIcon" class="weather-icon hidden" src="" alt="Weather Icon">

                <div class="weather-info">
                    <span id="temperature">--°C</span>
                    <span id="condition">--</span>
                </div>
                
                <p id="quote">""</p>
            </div>
            
            <div id="errorMessage" class="hidden error"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
